<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baca Halaman</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <header class="panel-bar">
      <span class="panel-name">Baca Halaman</span>
      <details id="panel-menu" class="panel-menu">
        <summary aria-label="Menu panel">···</summary>
        <div class="menu-actions">
          <button id="rescan" data-rescan type="button" disabled>Pindai ulang</button>
          <button id="add-source" data-add-source type="button">Tambah sumber</button>
          <button id="open-settings" data-open-settings type="button">Pengaturan</button>
        </div>
      </details>
    </header>

    <main class="workspace" id="workspace">
      <header class="page-heading">
        <div>
          <h1 id="tab-title">Halaman aktif</h1>
          <p id="tab-domain" class="meta" hidden></p>
        </div>
        <button id="show-sources" class="text-button source-toggle" type="button" aria-controls="sources-panel" aria-expanded="false">
          Sumber <span id="source-count"></span>
        </button>
      </header>
      <p id="status" class="status" role="status" aria-atomic="true">
        Klik ikon Baca Halaman atau tekan Alt+Shift+G di tab yang ingin dibaca.
      </p>
      <div id="connection-problem" class="connection-problem" hidden>
        <p id="connection-message" role="status"></p>
        <button class="text-button" data-open-settings type="button">Periksa</button>
      </div>

      <section id="sources-panel" data-workspace-view="sources" aria-label="Sumber" hidden>
        <div class="source-tools">
          <div>
            <label for="mode">Ambil teks dari</label>
            <select id="mode" disabled>
              <option value="main">Teks utama</option>
              <option value="selection">Teks yang dipilih</option>
              <option value="viewport">Teks di layar</option>
              <option value="page">Seluruh halaman</option>
            </select>
          </div>
          <button class="text-button" data-rescan type="button" disabled>Pindai ulang</button>
          <button class="text-button" data-add-source type="button">Tambah sumber</button>
        </div>
        <p id="source-status" class="status" role="status" hidden></p>
        <p id="source-limit" class="status" hidden>Batas gabungan 6.000 karakter mengikuti urutan sumber.</p>
        <div id="source-list"></div>
      </section>

      <section id="settings-panel" data-workspace-view="settings" aria-labelledby="settings-heading" hidden>
        <div class="settings-heading">
          <h2 id="settings-heading" tabindex="-1">Pengaturan</h2>
          <button id="close-settings" class="text-button" type="button">Selesai</button>
        </div>
        <div class="setting-row">
          <label for="model">Model lokal</label>
          <select id="model" disabled>
            <option value="">Memuat model…</option>
          </select>
        </div>
        <div id="thinking-field" class="setting-row" hidden>
          <label for="thinking">Thinking</label>
          <select id="thinking" disabled>
            <option value="off">Mati</option>
            <option value="on">Nyala</option>
          </select>
        </div>
        <div class="setting-row">
          <p id="ollama-status" class="status" role="status">Memeriksa Ollama…</p>
          <button id="check-models" class="text-button" type="button">Cek ulang</button>
        </div>
        <p id="ollama-origin" class="status" hidden>Tambahkan <code></code> ke OLLAMA_ORIGINS.</p>
      </section>

      <section class="conversation" data-workspace-view="conversation" aria-label="Percakapan">
        <div id="turns"></div>
      </section>
    </main>

    <form class="composer" id="composer">
      <div id="language-field" class="language-field" hidden>
        <label for="language">Bahasa tujuan</label>
        <input id="language" value="Indonesia" maxlength="60">
      </div>
      <label id="prompt-label" class="screen-reader" for="prompt">Pertanyaan</label>
      <textarea id="prompt" rows="2" maxlength="2000" placeholder="Tanya tentang halaman ini…" required></textarea>
      <div class="composer-footer">
        <label class="screen-reader" for="tool">Alat</label>
        <select id="tool">
          <option value="ask">Tanya halaman</option>
          <option value="summarize">Ringkas</option>
          <option value="explain">Jelaskan</option>
          <option value="answer">Jawab soal</option>
          <option value="translate">Terjemahkan</option>
        </select>
        <div class="composer-buttons">
          <button id="stop" class="text-button" type="button" hidden>Hentikan</button>
          <button id="send" class="primary" type="submit" disabled>Kirim</button>
        </div>
      </div>
      <p id="composer-hint" class="meta" hidden></p>
    </form>

    <dialog id="add-dialog" aria-labelledby="add-heading">
      <form id="source-form">
        <h2 id="add-heading">Tambah sumber teks</h2>
        <label for="source-name">Nama sumber (opsional)</label>
        <input id="source-name" maxlength="100">
        <label for="source-text">Ketik atau tempel teks</label>
        <textarea id="source-text" rows="5"></textarea>
        <label for="source-file">Atau pilih file TXT atau Markdown</label>
        <input type="file" id="source-file" accept=".txt,.md,.markdown,text/plain,text/markdown">
        <p id="add-status" class="status" role="status" hidden></p>
        <div class="dialog-actions">
          <button id="cancel-source" type="button">Batal</button>
          <button class="primary" type="submit">Tambahkan teks</button>
        </div>
      </form>
    </dialog>

    <template id="source-template">
      <details class="source">
        <summary><span class="source-label"></span> <span class="source-size meta"></span></summary>
        <label class="source-editor-label">Isi sumber</label>
        <textarea class="source-editor" rows="5" maxlength="6000"></textarea>
        <p class="source-truncated status" hidden>Sumber ini dipotong pada batas 6.000 karakter.</p>
        <div class="source-actions">
          <button class="source-up" type="button">Naik</button>
          <button class="source-down" type="button">Turun</button>
          <button class="source-copy" type="button">Salin</button>
          <button class="source-remove" type="button">Hapus</button>
        </div>
      </details>
    </template>

    <template id="turn-template">
      <article class="turn">
        <h2 class="turn-tool"></h2>
        <p class="turn-question"></p>
        <p class="turn-answer" hidden></p>
        <p class="turn-status status" role="status"></p>
        <p class="turn-sources meta"></p>
      </article>
    </template>
  </body>
</html>
